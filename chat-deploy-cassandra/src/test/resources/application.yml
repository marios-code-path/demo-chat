logging:
  level:
    org:
      springframework:
        data:
          cassandra: INFO

app:
  proto: rsocket
  primary: core
  users:
    create: true
  rootkeys:
    create: true

spring:
  cassandra:
    keyspace-name: chat_${app.key.type}
    contact-points: localhost
    port: 9042
    local-datacenter: datacenter1
    base-packages: com.demo.chat.persistence.cassandra
    request:
      # The schema setup runs through this session. The 2 second driver
      # default timed out a slow runner. `CHAT-sgyaaivp`.
      timeout: 10s
  main:
    web-application-type: reactive
  application:
    name: "${app.primary}-service-${app.proto}"

management:
  endpoints:
    enabled-by-default: false