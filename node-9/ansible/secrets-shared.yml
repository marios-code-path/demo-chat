---
# Write the shared node 9 secrets from the encrypted source.
#
# Each value is create-only. An existing line keeps its bytes, and an
# existing file keeps its mode. Every task that holds a value sets no_log.
- name: Write the shared node 9 secrets
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vault/shared.yml
  vars:
    target: "{{ lookup('env', 'NODE9_SECRETS_FILE') }}"
    secrets_dir: "{{ lookup('env', 'NODE9_SECRETS_DIR') }}"
    shared_keys:
      CHAT_SERVICE_PASSWORD: "{{ service_password }}"
      CHAT_ADMIN_PASSWORD: "{{ admin_password }}"
      CHAT_EMBEDDING_OPENAI_API_KEY: "{{ embedding_api_key }}"
      CHAT_USER_SIGMA_PASSWORD: "{{ sigma_password }}"
      CHAT_USER_THETA_PASSWORD: "{{ theta_password }}"
      CHAT_USER_PHI_PASSWORD: "{{ phi_password }}"
    agent_users:
      - Sigma
      - Theta
      - Phi
  tasks:
    - name: Find the secrets file
      ansible.builtin.stat:
        path: "{{ target }}"
      register: secrets_file

    - name: Read the secrets file
      ansible.builtin.slurp:
        src: "{{ target }}"
      register: secrets_content
      when: secrets_file.stat.exists
      no_log: true

    - name: Remember the current text
      ansible.builtin.set_fact:
        current_text: "{{ (secrets_content.content | default('') | b64decode) }}"
      no_log: true

    - name: Write a missing value
      ansible.builtin.lineinfile:
        path: "{{ target }}"
        line: "{{ item.key }}={{ item.value }}"
        create: true
        mode: '0600'
      loop: "{{ shared_keys | dict2items }}"
      when: (item.key ~ '=') not in current_text
      no_log: true

    - name: Create the secrets directory
      ansible.builtin.file:
        path: "{{ secrets_dir }}"
        state: directory
        mode: '0700'

    - name: Find a symbolic link at an agent password
      ansible.builtin.stat:
        path: "{{ secrets_dir }}/{{ item }}.password"
        follow: false
      loop: "{{ agent_users }}"
      register: agent_paths

    - name: Refuse a symbolic link at an agent password
      ansible.builtin.fail:
        msg: "{{ secrets_dir }}/{{ item.item }}.password is a symbolic link"
      when: item.stat.islnk | default(false)
      loop: "{{ agent_paths.results }}"

    - name: Write the agent password files
      ansible.builtin.copy:
        content: "{{ shared_keys['CHAT_USER_' ~ (item | upper) ~ '_PASSWORD'] }}\n"
        dest: "{{ secrets_dir }}/{{ item }}.password"
        mode: '0600'
        force: false
      loop: "{{ agent_users }}"
      no_log: true
