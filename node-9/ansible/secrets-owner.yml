---
# Write the owner password from the owner Vault.
#
# The owner runs this play from a terminal. Ansible asks for the owner Vault
# password and never stores it. The value is create-only. No client copy is
# written. See design decision 35.
- name: Write the owner password
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vault/owner.yml
  vars:
    target: "{{ lookup('env', 'NODE9_SECRETS_FILE') }}"
  tasks:
    - name: Find the secrets file
      ansible.builtin.stat:
        path: "{{ target }}"
      register: secrets_file

    - name: Read the secrets file
      ansible.builtin.slurp:
        src: "{{ target }}"
      register: secrets_content
      when: secrets_file.stat.exists
      no_log: true

    - name: Remember the current text
      ansible.builtin.set_fact:
        current_text: "{{ (secrets_content.content | default('') | b64decode) }}"
      no_log: true

    - name: Write the owner value when it is missing
      ansible.builtin.lineinfile:
        path: "{{ target }}"
        line: "CHAT_USER_MARIO_PASSWORD={{ mario_password }}"
        create: true
        mode: '0600'
      when: "'CHAT_USER_MARIO_PASSWORD=' not in current_text"
      no_log: true
