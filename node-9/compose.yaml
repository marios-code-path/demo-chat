# Node 9 core, Cassandra, Redis, and Consul. Its own Compose project.
# It shares no project, network, image tag, or volume with node 16.
# See CHAT-hcfgkbuz.
services:
  cassandra:
    image: cassandra:${CASSANDRA_VERSION:?Set CASSANDRA_VERSION}
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes:
      - type: bind
        source: ./data/cassandra
        target: /var/lib/cassandra
      - type: bind
        source: ./schema
        target: /schema
        read_only: true
    networks:
      - node-9-net

  lucene-volume-init:
    image: busybox:1.36
    user: root
    command: chown -R ${LUCENE_OWNER:-1002:1001} /var/lib/chat/lucene
    volumes:
      - type: bind
        source: ./data/lucene
        target: /var/lib/chat/lucene

  redis:
    image: redis:${REDIS_VERSION:?Set REDIS_VERSION}
    volumes:
      - type: bind
        source: ./data/redis
        target: /data
    networks:
      - node-9-net

  consul:
    image: hashicorp/consul:${CONSUL_VERSION:?Set CONSUL_VERSION}
    environment:
      CONSUL_BIND_INTERFACE: eth0
    volumes:
      - type: bind
        source: ./data/consul
        target: /consul/data
    networks:
      - node-9-net

  core-service-rsocket:
    image: ${CORE_IMAGE:?Set CORE_IMAGE}
    depends_on:
      cassandra:
        condition: service_started
      lucene-volume-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      consul:
        condition: service_started
    environment:
      CHAT_SERVICE_PASSWORD: ${CHAT_SERVICE_PASSWORD:?Set CHAT_SERVICE_PASSWORD}
      CHAT_ADMIN_PASSWORD: ${CHAT_ADMIN_PASSWORD:?Set CHAT_ADMIN_PASSWORD}
      APP_SERVICE_CORE_EMBEDDING_OPENAI_BASE_URL: ${CHAT_EMBEDDING_OPENAI_BASE_URL:?Set CHAT_EMBEDDING_OPENAI_BASE_URL}
      APP_SERVICE_CORE_EMBEDDING_OPENAI_MODEL: ${CHAT_EMBEDDING_OPENAI_MODEL:?Set CHAT_EMBEDDING_OPENAI_MODEL}
      APP_SERVICE_CORE_EMBEDDING_IDENTITY: ${CHAT_EMBEDDING_IDENTITY:?Set CHAT_EMBEDDING_IDENTITY}
      APP_SERVICE_CORE_EMBEDDING_OPENAI_API_KEY: ${CHAT_EMBEDDING_OPENAI_API_KEY:?Set CHAT_EMBEDDING_OPENAI_API_KEY}
      APP_INDEX_LUCENE_ROOT: /var/lib/chat/lucene
      BPL_JVM_HEAD_ROOM: "15"
      JAVA_TOOL_OPTIONS: -XX:MaxDirectMemorySize=256M
      REDIS_TOPICS_HOST: redis
      REDIS_TOPICS_PORT: "6379"
      SPRING_CONFIG_IMPORT: file:/etc/node-9/userinit.yml
    ports:
      - "127.0.0.1:${NODE9_RSOCKET_PORT:?Set NODE9_RSOCKET_PORT}:6790"
      - "127.0.0.1:${NODE9_MGMT_PORT:?Set NODE9_MGMT_PORT}:6791"
    volumes:
      - type: bind
        source: ./data/lucene
        target: /var/lib/chat/lucene
      - type: bind
        source: ./userinit.yml
        target: /etc/node-9/userinit.yml
        read_only: true
    networks:
      - node-9-net

networks:
  node-9-net:
    driver: bridge
