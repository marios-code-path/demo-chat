# The test server binds loopback alone.
# A wildcard bind on macOS accepts a port that a loopback listener already
# holds, and the loopback listener then receives every connection. That
# failure is silent and it costs 135 s. See CHAT-ivtnvgyg.
spring.rsocket.server.address=127.0.0.1
spring.rsocket.server.port=0
spring.main.web-application-type=reactive
logging.level.com.demo.chat.client.rsocket=DEBUG
logging.level.io.rsocket.FrameLogger=DEBUG