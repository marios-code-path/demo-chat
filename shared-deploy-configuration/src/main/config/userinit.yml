# Don't forget, the roles must specify a valid or wildcard role mapped to the wildcard user (anonymous)
#
# Every key here must bind to UserInitializationProperties in chat-deploy.
# That type names passwordEncoder, initialRoles and initialUsers, and a
# RoleDefinition names user, target and role. Spring ignores any other key,
# so an unbound section has no effect and reports no error.
# UserInitConfigBindingTests holds that rule.
#
# The proposed operation policy lives in
# docs/superpowers/specs/2026-09-23-operation-policy-draft.md. It is a design
# input and no code loads it. See CHAT-zhjltbky and CHAT-zcxgrtqc.
app:
  init:
    passwordEncoder: bcrypt
    initialRoles:
      rolesAllowed: [ "READ", "CREATE", "WRITE", "REMOVE", "SEND", "JOIN", "*" ]
      wildcard: "*"
      roles:
        - { user: Admin, target: Admin, role: "*" }
        - { user: Anon, target: User, role: FIND }
        - { user: Anon, target: User, role: PUT }
        - { user: Anon, target: Message, role: GET }
        - { user: User, target: Message, role: SEND }
        - { user: User, target: MessageTopic, role: NEW }
        - { user: User, target: MessageTopic, role: GET_ALL }
        - { user: User, target: MessageTopic, role: GET }
        - { user: User, target: MessageTopic, role: JOIN }
        - { user: User, target: MessageTopic, role: MEMBERS }
    initialUsers:
      Anon:
        handle: Anon
        name: "ANY USER"
        imageUri: chatimg://anon.png
        password: _
      Admin:
        handle: Admin
        name: "SUPER USER"
        imageUri: chatimg://plaid.png
        password: changeme
      # The MCP adapter account. It is a plain user. It takes no ChatIdentity,
      # so it holds no Admin reach and no grant row names it. It carries no
      # password key, so the start generates a credential and prints it. Only
      # the newest output holds the live password. See CHAT-werokcbb.
      Agent:
        handle: Agent
        name: "MCP ADAPTER"
        imageUri: chatimg://agent.png