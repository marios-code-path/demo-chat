name: Maven CI

on:
  push:
    branches: [master]
  pull_request:

# A branch pushed to this repository fires both push and pull_request, so every
# PR built twice. Restricting push to master stops the duplicate; the
# concurrency group cancels superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          ~/.m2/wrapper
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
          ${{ runner.os }}-
    - name: Test
      run: mvn -B clean test

  # This job runs the container tests. The build job's `test` phase never
  # reaches `package`, so it cannot create the image for chat-shell tests.
  # `verify` creates that image before chat-shell starts. The test-build
  # profile enables the image build. The job also runs unit tests during
  # verify. One Maven reactor run preserves image, dependency, and test order.
  # No merge gate applies.
  # Spec: docs/superpowers/specs/2026-08-28-ci-integration-execution-design.md
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          ~/.m2/wrapper
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
          ${{ runner.os }}-
    - name: Integration tests
      run: mvn -B clean verify -Ptest-build,integration
