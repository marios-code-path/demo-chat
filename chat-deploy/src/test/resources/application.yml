# Role names use exact domain names, Admin, or Anon. The value * marks ownership.
#logging.level.org.springframework: DEBUG
#logging.level.io.rsocket.FrameLogger: DEBUG
logging:
  level:
    root: DEBUG
    io:
      rsocket:
        FrameLogger: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %logger.%M - %msg%n"
#  level:
#    io.rsocket.FrameLogger: DEBUG

management:
  info:
    git:
      mode: full
  endpoint:
    shutdown:
      enabled: true
    enabled-by-default: true
    health:
      enabled: true
    info:
      enabled: true
  endpoints:
    web:
      exposure:
        include: info,health,shutdown

spring:
  main:
    web-application-type: reactive
  application:
    name: "${app.primary}-service-${app.proto}"
  cloud:
    consul:
      enabled: false
      discovery:
        enabled: false
      config:
        enabled: false
        format: YAML
        data-key: data

app:
  primary: core
  proto: rsocket
  key:
    type: long
  users:
    create: true
  rootkeys:
    create: true
  init:
    initialRoles:
      roles:
        - { user: Admin, target: Admin, role: "*" }
        - { user: Anon, target: User, role: READ }
        - { user: Anon, target: User, role: CREATE }
        - { user: Anon, target: Message, role: READ }
        - { user: Anon, target: MessageTopic, role: READ }
        - { user: User, target: User, role: READ }
        - { user: User, target: Message, role: READ }
        - { user: User, target: Message, role: CREATE }
        - { user: User, target: MessageTopic, role: JOIN }
        - { user: User, target: MessageTopic, role: SEND }
        - { user: User, target: MessageTopic, role: READ }
    initialUsers:
      Anon:
        handle: Anon
        name: "ANY USER"
        imageUri: chatimg://anon.png,
      Admin:
        handle: Admin
        name: "SUPER USER"
        imageUri: chatimg://plaid.png
