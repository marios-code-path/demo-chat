spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    # KafkaDeployConfiguration builds its own SenderOptions and ReceiverOptions
    # and reads only bootstrap-servers from this block. The pub/sub receiver
    # therefore does NOT take group-id from here. It derives
    # chat-kafka-<nodeId> from app.nodeid, so that every instance reads every
    # record. See CHAT-xblitvkl.
    #
    # Whether any Spring Kafka auto-configuration bean still reads the consumer
    # block is not measured, so the block stays.
    consumer:
      group-id: chat-kafka
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.demo.chat.domain

app:
  service:
    core:
      pubsub: kafka
