name: chat-node-9
services:
  cassandra:
    environment:
      HEAP_NEWSIZE: 256M
      MAX_HEAP_SIZE: 1G
    image: cassandra:4.1.3
    networks:
      node-9-net: null
    volumes:
      - type: bind
        source: /Users/darkbit1001/workspace/demo-chat/.worktrees/chat-hcfgkbuz-node-9/node-9/data/cassandra
        target: /var/lib/cassandra
      - type: bind
        source: /Users/darkbit1001/workspace/demo-chat/.worktrees/chat-hcfgkbuz-node-9/node-9/schema
        target: /schema
        read_only: true
  consul:
    environment:
      CONSUL_BIND_INTERFACE: eth0
    image: hashicorp/consul:2.0.4
    networks:
      node-9-net: null
    volumes:
      - type: bind
        source: /Users/darkbit1001/workspace/demo-chat/.worktrees/chat-hcfgkbuz-node-9/node-9/data/consul
        target: /consul/data
  core-service-rsocket:
    depends_on:
      cassandra:
        condition: service_started
        required: true
      consul:
        condition: service_started
        required: true
      lucene-volume-init:
        condition: service_completed_successfully
        required: true
      redis:
        condition: service_started
        required: true
    environment:
      APP_INDEX_LUCENE_ROOT: /var/lib/chat/lucene
      APP_SERVICE_CORE_EMBEDDING_IDENTITY: nomic-embed-text-v1-5-768
      APP_SERVICE_CORE_EMBEDDING_OPENAI_API_KEY: replace-me
      APP_SERVICE_CORE_EMBEDDING_OPENAI_BASE_URL: http://node2.lan:6090/v1
      APP_SERVICE_CORE_EMBEDDING_OPENAI_MODEL: nomic-embed-text-v1.5.Q8_0.gguf
      BPL_JVM_HEAD_ROOM: "15"
      CHAT_ADMIN_PASSWORD: <redacted>
      CHAT_SERVICE_PASSWORD: <redacted>
      JAVA_TOOL_OPTIONS: -XX:MaxDirectMemorySize=256M
      REDIS_TOPICS_HOST: redis
      REDIS_TOPICS_PORT: "6379"
      SPRING_CONFIG_IMPORT: file:/etc/node-9/userinit.yml
    image: node-9/cassandra-core-service-rsocket:0.0.1
    networks:
      node-9-net: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 6790
        published: "6890"
        protocol: tcp
      - mode: ingress
        host_ip: 127.0.0.1
        target: 6791
        published: "6891"
        protocol: tcp
    volumes:
      - type: bind
        source: /Users/darkbit1001/workspace/demo-chat/.worktrees/chat-hcfgkbuz-node-9/node-9/data/lucene
        target: /var/lib/chat/lucene
      - type: bind
        source: /Users/darkbit1001/workspace/demo-chat/.worktrees/chat-hcfgkbuz-node-9/node-9/userinit.yml
        target: /etc/node-9/userinit.yml
        read_only: true
  lucene-volume-init:
    command:
      - chown
      - -R
      - 1002:1001
      - /var/lib/chat/lucene
    image: busybox:1.36
    networks:
      default: null
    user: root
    volumes:
      - type: bind
        source: /Users/darkbit1001/workspace/demo-chat/.worktrees/chat-hcfgkbuz-node-9/node-9/data/lucene
        target: /var/lib/chat/lucene
  redis:
    image: redis:7
    networks:
      node-9-net: null
    volumes:
      - type: bind
        source: /Users/darkbit1001/workspace/demo-chat/.worktrees/chat-hcfgkbuz-node-9/node-9/data/redis
        target: /data
networks:
  default:
    name: chat-node-9_default
  node-9-net:
    name: chat-node-9_node-9-net
    driver: bridge
